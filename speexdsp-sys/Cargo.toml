[package]
name = "speexdsp-sys"
version = "0.1.2"
authors = ["Luca Barbato <lu_zero@gentoo.org>"]
license = "MIT"
description = "low level bindings for the speexdsp library"
repository = "https://github.com/rust-av/speexdsp-rs"
readme = "../README.md"
homepage = "https://github.com/rust-av/speexdsp-rs"
keywords = ["audio", "resampler"]
categories = ["api-bindings"]
edition.workspace = true
exclude = ["speexdsp/doc/*", "speexdsp/html/*"]

[package.metadata.docs.rs]
features = ["vendored"]

[features]
vendored = []

[build-dependencies]
pkg-config = "0.3"
bindgen = "0.72"
cc = "1"

[dev-dependencies]
byteorder = "1.3"
structopt = "0.3"
